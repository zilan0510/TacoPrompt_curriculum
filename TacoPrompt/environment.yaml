name: tacoprompt
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
  - defaults
dependencies:
  - python=3.10.14
  - pip=24.0
  # 核心：PyTorch 2.1.2 + CUDA 12.1，CUDA 13.2 驱动向下完美兼容
  - pytorch=2.1.2=py3.10_cuda12.1_cudnn8.9.2_0
  - torchvision=0.16.2=py310_cuda12.1
  - torchaudio=2.1.2=py310_cuda12.1
  - cudatoolkit=12.1.3
  # 基础科学计算
  - numpy=1.26.4
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - pandas=2.2.1
  # NLP 核心依赖
  - transformers=4.36.2
  - tokenizers=0.15.2
  - sentencepiece=0.2.0
  # 工具库
  - tqdm=4.66.2
  - pyyaml=6.0.1
  - gensim=4.3.2
  - networkx=3.2.1
  - loguru=0.7.2
  - click=8.1.7
  # 系统基础库
  - setuptools=69.0.3
  - typing-extensions=4.9.0
  - certifi=2024.2.2
  - pip:
    - rich==13.7.1
    - filelock==3.13.1
    - huggingface-hub==0.20.3
